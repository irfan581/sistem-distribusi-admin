name: CI

# Memeriksa setiap push dan pull request: uji backend dan build frontend.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (uji Laravel)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kmj_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, exif, zip, bcmath, pdo_mysql
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - name: Pasang dependensi
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan uji
        run: php artisan test

  frontend:
    name: Frontend (build Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # package-lock.json sengaja tidak masuk git (lihat .gitignore), jadi
      # npm install, bukan npm ci, dan tanpa cache npm.
      - name: Pasang dependensi
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
